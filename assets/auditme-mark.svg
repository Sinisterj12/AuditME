<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 256 256">
  <title id="title">AuditME mark</title>
  <desc id="desc">A controlled signal path pulling scattered agent work into verified repo memory.</desc>
  <defs>
    <linearGradient id="mark-bg" x1="32" y1="24" x2="224" y2="232" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#121826"/>
      <stop offset="0.56" stop-color="#20304c"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="mark-line" x1="54" y1="186" x2="204" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f97316"/>
      <stop offset="0.5" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#a3e635"/>
    </linearGradient>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#020617" flood-opacity="0.32"/>
    </filter>
  </defs>
  <rect width="256" height="256" rx="48" fill="url(#mark-bg)"/>
