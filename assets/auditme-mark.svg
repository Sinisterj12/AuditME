    <path d="M67 194h105c12 0 21-9 21-21v-38" fill="none" stroke="#f8fafc" stroke-width="10" stroke-linecap="round"/>
    <circle cx="58" cy="177" r="17" fill="#f97316"/>
    <circle cx="128" cy="115" r="19" fill="#38bdf8"/>
    <circle cx="186" cy="82" r="17" fill="#a3e635"/>
    <rect x="77" y="154" width="64" height="44" rx="10" fill="#f8fafc"/>
    <path d="M91 173h36M91 187h24" stroke="#0f172a" stroke-width="7" stroke-linecap="round"/>
  </g>
