name: First-alpha feedback
description: Feedback about the intended public alpha command path without treating it as released.
title: "[alpha-feedback]: "
labels: ["alpha", "feedback"]
body:
  - type: markdown
    attributes:
      value: |
        AuditME is still coming soon. Use this template for feedback on the intended alpha shape, not for release-support requests.
  - type: dropdown
    id: command
    attributes:
      label: Area
      options:
        - auditme init
        - auditme resume
        - auditme verify
        - auditme handoff
        - Generated files
        - Install / package plan
        - Other
    validations:
      required: true
  - type: textarea
    id: feedback
    attributes:
      label: Feedback
      description: What should be clearer, safer, or easier before the official alpha?
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety
      options:
        - label: I did not include secrets, credentials, customer data, private relay notes, or personal machine paths.
          required: true
